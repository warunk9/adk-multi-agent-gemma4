[project]
name = "adk-multi-agent-gemma4"
version = "0.1.0"
description = "Multi-agent customer support POC using Gemma 4 and Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk[extensions]>=2.0.0",
    "google-cloud-aiplatform>=1.38.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["customer_support"]

[tool.ruff]
line-length = 100
